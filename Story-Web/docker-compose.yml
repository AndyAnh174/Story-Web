version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Story AI Platform — Production Docker Compose
# Port duy nhất ra ngoài: 8981
# Domain: truyen.andyanh.id.vn
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: story_nginx
    restart: always
    ports:
      - "8981:8981"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - story_net

  # ── Frontend Next.js ────────────────────────────────────────────────────────
  web:
    build:
      context: .                        # Monorepo root (Story-Web/)
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: story_web
    restart: always
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NODE_ENV=production
    networks:
      - story_net

  # ── Backend FastAPI ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: story_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - OLLAMA_GEN_HOST=${OLLAMA_GEN_HOST}
      - OLLAMA_MODEL_GEN=${OLLAMA_MODEL_GEN:-gpt-oss:120b-cloud}
      - OLLAMA_EMBED_HOST=${OLLAMA_EMBED_HOST}
      - OLLAMA_MODEL_EMBED=${OLLAMA_MODEL_EMBED:-bge-m3:567m}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - story_net

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: story_worker
    restart: always
    command: celery -A app.workers.tasks worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - OLLAMA_GEN_HOST=${OLLAMA_GEN_HOST}
      - OLLAMA_MODEL_GEN=${OLLAMA_MODEL_GEN:-gpt-oss:120b-cloud}
      - OLLAMA_EMBED_HOST=${OLLAMA_EMBED_HOST}
      - OLLAMA_MODEL_EMBED=${OLLAMA_MODEL_EMBED:-bge-m3:567m}
    depends_on:
      - redis
      - postgres
    networks:
      - story_net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: story_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - story_net

  # ── Qdrant Vector DB ────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: story_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - story_net

  # ── Neo4j Graph DB ──────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: story_neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - story_net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: story_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - story_net

# ─────────────────────────────────────────────────────────────────────────────
networks:
  story_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
